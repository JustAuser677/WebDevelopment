mily="DejaVu Sans" font-size="15" font-weight="700" text-anchor="middle" x="1197.0" y="337">Записаться</text><rect fill="#FFFFFF" height="48" rx="12" ry="12" stroke="#D9E2EC" stroke-width="1" width="318" x="1038" y="372" /><text fill="#172033" font-family="DejaVu Sans" font-size="15" font-weight="700" text-anchor="middle" x="1197.0" y="403">♡ В избранное</text><line stroke="#D9E2EC" stroke-width="1" x1="1038" x2="1356" y1="442" y2="442" /><text fill="#667085" font-family="DejaVu Sans" font-size="13" font-weight="700" text-anchor="start" x="1038" y="477">Организатор</text><text fill="#172033" font-family="DejaVu Sans" font-size="15" font-weight="600" text-anchor="start" x="1038" y="503">Кафедра веб-технологий</text><rect fill="#FFFFFF" height="72" rx="16" ry="16" stroke="#D9E2EC" stroke-width="1" width="930" x="54" y="416" /><text fill="#3B5CCC" font-family="DejaVu Sans" font-size="16" font-weight="700" text-anchor="start" x="82" y="461">Описание</text><rect fill="#3B5CCC" height="3" rx="1" ry="1" stroke="none" stroke-width="1" width="82" x="82" y="478" /><text fill="#667085" font-family="DejaVu Sans" font-size="16" font-weight="600" text-anchor="start" x="232" y="461">Программа</text><text fill="#667085" font-family="DejaVu Sans" font-size="16" font-weight="600" text-anchor="start" x="382" y="461">Спикеры</text><rect fill="#FFFFFF" height="418" rx="20" ry="20" stroke="#D9E2EC" stroke-width="1" width="930" x="54" y="510" /><text fill="#172033" font-family="DejaVu Sans" font-size="22" font-weight="700" text-anchor="start" x="82" y="554">О мероприятии</text><text fill="#667085" font-family="DejaVu Sans" font-size="16" font-weight="500" text-anchor="start" x="82" y="590">На занятии участники научатся выбирать семантические элементы страницы,</text><text fill="#667085" font-family="DejaVu Sans" font-size="16" font-weight="500" text-anchor="start" x="82" y="616">определять границы компонентов и проверять структуру документа до стилизации.</text><text fill="#172033" font-family="DejaVu Sans" font-size="18" font-weight="700" text-anchor="start" x="82" y="666">Что будет на встрече</text><circle cx="90" cy="701" fill="#3B5CCC" r="4" /><text fill="#172033" font-family="DejaVu Sans" font-size="15" font-weight="500" text-anchor="start" x="106" y="707">landmark-элементы: header, nav, main, aside, footer;</text><circle cx="90" cy="736" fill="#3B5CCC" r="4" /><text fill="#172033" font-family="DejaVu Sans" font-size="15" font-weight="500" text-anchor="start" x="106" y="742">article и section: когда использовать;</text><circle cx="90" cy="771" fill="#3B5CCC" r="4" /><text fill="#172033" font-family="DejaVu Sans" font-size="15" font-weight="500" text-anchor="start" x="106" y="777">формы, label, состояния ошибок;</text><circle cx="90" cy="806" fill="#3B5CCC" r="4" /><text fill="#172033" font-family="DejaVu Sans" font-size="15" font-weight="500" text-anchor="start" x="106" y="812">небольшой разбор реального макета.</text><rect fill="#F4F7FB" height="190" rx="16" ry="16" stroke="none" stroke-width="1" width="326" x="610" y="664" /><text fill="#172033" font-family="DejaVu Sans" font-size="16" font-weight="700" text-anchor="start" x="634" y="700">Интерактивные состояния</text><text fill="#172033" font-family="DejaVu Sans" font-size="14" font-weight="600" text-anchor="start" x="634" y="738">Вкладки</text><text fill="#667085" font-family="DejaVu Sans" font-size="13" font-weight="600" text-anchor="end" x="912" y="738">active / hover</text><text fill="#172033" font-family="DejaVu Sans" font-size="14" font-weight="600" text-anchor="start" x="634" y="768">Запись</text><text fill="#667085" font-family="DejaVu Sans" font-size="13" font-weight="600" text-anchor="end" x="912" y="768">default / loading</text><text fill="#172033" font-family="DejaVu Sans" font-size="14" font-weight="600" text-anchor="start" x="634" y="798">Избранное</text><text fill="#667085" font-family="DejaVu Sans" font-size="13" font-weight="600" text-anchor="end" x="912" y="798">off / on</text><text fill="#172033" font-family="DejaVu Sans" font-size="14" font-weight="600" text-anchor="start" x="634" y="828">Места</text><text fill="#667085" font-family="DejaVu Sans" font-size="13" font-weight="600" text-anchor="end" x="912" y="828">available / full</text></svg>