<svg baseProfile="full" height="1024" version="1.1" width="1440" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F4F7FB" height="1024" rx="0" ry="0" stroke="none" stroke-width="1" width="1440" x="0" y="0" /><rect fill="#FFFFFF" height="84" rx="0" ry="0" stroke="none" stroke-width="1" width="1440" x="0" y="0" /><line stroke="#D9E2EC" stroke-width="1" x1="0" x2="1440" y1="84" y2="84" /><rect fill="#3B5CCC" height="40" rx="12" ry="12" stroke="none" stroke-width="1" width="40" x="54" y="22" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="15" font-weight="700" text-anchor="middle" x="74" y="49">CF</text><text fill="#172033" font-family="DejaVu Sans" font-size="22" font-weight="700" text-anchor="start" x="108" y="51">CampusFlow</text><text fill="#667085" font-family="DejaVu Sans" font-size="16" font-weight="500" text-anchor="start" x="310" y="51">Каталог</text><text fill="#667085" font-family="DejaVu Sans" font-size="16" font-weight="500" text-anchor="start" x="410" y="51">Мои события</text><text fill="#3B5CCC" font-family="DejaVu Sans" font-size="16" font-weight="700" text-anchor="start" x="550" y="51">Профиль</text><rect fill="#3B5CCC" height="3" rx="1" ry="1" stroke="none" stroke-width="1" width="96" x="550" y="72" /><rect fill="#F4F7FB" height="44" rx="12" ry="12" stroke="none" stroke-width="1" width="214" x="1120" y="20" /><text fill="#667085" font-family="DejaVu Sans" font-size="15" font-weight="500" text-anchor="start" x="1150" y="48">Поиск</text><circle cx="1366" cy="42" fill="#EEF2FF" r="20" /><text fill="#3B5CCC" font-family="DejaVu Sans" font-size="12" font-weight="700" text-anchor="middle" x="1366" y="47">AV</text><text fill="#172033" font-family="DejaVu Sans" font-size="32" font-weight="700" text-anchor="start" x="54" y="145">Регистрация на мероприятие</text><text fill="#667085" font-family="DejaVu Sans" font-size="16" font-weight="500" text-anchor="start" x="54" y="178">Заполните данные. Поля со звёздочкой обязательны.</text><rect fill="#FFFFFF" height="704" rx="20" ry="20" stroke="#D9E2EC" stroke-width="1" width="870" x="54" y="214" /><text fill="#172033" font-family="DejaVu Sans" font-size="20" font-weight="700" text-anchor="start" x="84" y="258">Контактные данные</text><text fill="#667085" font-family="DejaVu Sans" font-size="14" font-weight="700" text-anchor="start" x="84" y="292">Имя и фамилия *</text><rect fill="#FFFFFF" height="50" rx="10" ry="10" stroke="#D9E2EC" stroke-width="1" width="780" x="84" y="306" /><text fill="#172033" font-family="DejaVu Sans" font-size="15" font-weight="500" text-anchor="start" x="104" y="337">Алексей Вернер</text><text fill="#667085" font-family="DejaVu Sans" font-size="14" font-weight="700" text-anchor="start" x="84" y="384">E-mail *</text><rect fill="#FFFFFF" height="50" rx="10" ry="10" stroke="#D9E2EC" stroke-width="1" width="780" x="84" y="398" /><text fill="#172033" font-family="DejaVu Sans" font-size="15" font-weight="500" text-anchor="start" x="104" y="429">student@example.com</text><text fill="#667085" font-family="DejaVu Sans" font-size="14" font-weight="700" text-anchor="start" x="84" y="476">Группа / команда</text><rect fill="#FFFFFF" height="50" rx="10" ry="10" stroke="#D9E2EC" stroke-width="1" width="780" x="84" y="490" /><text fill="#172033" font-family="DejaVu Sans" font-size="15" font-weight="500" text-anchor="start" x="104" y="521">ИТИС-41</text><text fill="#667085" font-family="DejaVu Sans" font-size="14" font-weight="700" text-anchor="start" x="84" y="576">Формат участия *</text><circle cx="93" cy="608" fill="#3B5CCC" r="9" stroke="#D9E2EC" /><text fill="#172033" font-family="DejaVu Sans" font-size="15" font-weight="600" text-anchor="start" x="112" y="613">Очно</text><circle cx="253" cy="608" fill="#FFFFFF" r="9" stroke="#D9E2EC" /><text fill="#172033" font-family="DejaVu Sans" font-size="15" font-weight="600" text-anchor="start" x="272" y="613">Онлайн</text><text fill="#667085" font-family="DejaVu Sans" font-size="14" font-weight="700" text-anchor="start" x="84" y="658">Комментарий</text><rect fill="#FFFFFF" height="90" rx="10" ry="10" stroke="#D9E2EC" stroke-width="1" width="780" x="84" y="674" /><text fill="#667085" font-family="DejaVu Sans" font-size="15" font-weight="500" text-anchor="start" x="104" y="706">Например, вопрос организатору...</text><rect fill="#3B5CCC" height="20" rx="4" stroke="#3B5CCC" width="20" x="84" y="790" /><text fill="#fff" font-family="DejaVu Sans" font-size="13" font-weight="700" text-anchor="middle" x="94" y="806">✓</text><text fill="#172033" font-family="DejaVu Sans" font-size="14" font-weight="500" text-anchor="start" x="116" y="806">Я согласен с правилами участия</text><rect fill="#3B5CCC" height="52" rx="12" ry="12" stroke="none" stroke-width="1" width="210" x="84" y="838" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="15" font-weight="700" text-anchor="middle" x="189.0" y="869">Отправить заявку</text><rect fill="#FFFFFF" height="48" rx="12" ry="12" stroke="#D9E2EC" stroke-width="1" width="120" x="308" y="840" /><text fill="#172033" font-family="DejaVu Sans" font-size="15" font-weight="700" text-anchor="middle" x="368.0" y="871">Отмена</text><rect fill="#FFFFFF" height="704" rx="20" ry="20" stroke="#D9E2EC" stroke-width="1" width="426" x="958" y="214" /><text fill="#172033" font-family="DejaVu Sans" font-size="20" font-weight="700" text-anchor="start" x="988" y="258">Состояния формы</text><text fill="#172033" font-family="DejaVu Sans" font-size="15" font-weight="700" text-anchor="start" x="988" y="306">1. Ошибка обязательного поля</text><text fill="#667085" font-family="DejaVu Sans" font-size="13" font-weight="700" text-anchor="start" x="988" y="340">E-mail *</text><rect fill="#FFFFFF" height="48" rx="10" ry="10" stroke="#D14343" stroke-width="2" width="336" x="988" y="354" /><text fill="#172033" font-family="DejaVu Sans" font-size="14" font-weight="500" text-anchor="start" x="1004" y="384">student@</text><text fill="#D14343" font-family="DejaVu Sans" font-size="13" font-weight="600" text-anchor="start" x="988" y="426">Введите корректный e-mail</text><line stroke="#D9E2EC" stroke-width="1" x1="988" x2="1354" y1="462" y2="462" /><text fill="#172033" font-family="DejaVu Sans" font-size="15" font-weight="700" text-anchor="start" x="988" y="508">2. Отправка</text><rect fill="#8FA2E5" height="48" rx="12" ry="12" stroke="none" stroke-width="1" width="336" x="988" y="528" /><text fill="#fff" font-family="DejaVu Sans" font-size="15" font-weight="700" text-anchor="middle" x="1156" y="558">Отправка…</text><text fill="#667085" font-family="DejaVu Sans" font-size="13" font-weight="500" text-anchor="start" x="988" y="596">Кнопка недоступна до завершения.</text><line stroke="#D9E2EC" stroke-width="1" x1="988" x2="1354" y1="628" y2="628" /><text fill="#172033" font-family="DejaVu Sans" font-size="15" font-weight="700" text-anchor="start" x="988" y="674">3. Успех</text><rect fill="#ECFDF3" height="128" rx="14" ry="14" stroke="none" stroke-width="1" width="336" x="988" y="694" /><text fill="#027A48" font-family="DejaVu Sans" font-size="17" font-weight="700" text-anchor="start" x="1008" y="730">✓ Заявка принята</text><text fill="#475467" font-family="DejaVu Sans" font-size="13" font-weight="500" text-anchor="start" x="1008" y="761">Подтверждение отправлено на почту.</text><text fill="#3B5CCC" font-family="DejaVu Sans" font-size="13" font-weight="700" text-anchor="start" x="1008" y="795">Перейти в «Мои события» →</text></svg>